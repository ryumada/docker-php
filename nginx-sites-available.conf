# This upstream block defines the location of your PHP-FPM service.
upstream {your_upstream_name} {
    # This is the IP and port of your PHP-FPM container.
    server 127.0.0.1:10002;
}

# This server block listens on port 80 and redirects all HTTP traffic to HTTPS.
server {
    listen 80;
    server_name {your_domain_name};

    # This security check ensures that only requests for your domain are processed.
    if ($host != "{your_domain_name}") {
        return 403;
    }

    return 301 https://$host$request_uri;
}

# This is the main server block for handling HTTPS traffic.
server {
    listen 443 ssl http2;
    server_name {your_domain_name};

    # Another security check for HTTPS.
    if ($host != "{your_domain_name}") {
        return 403;
    }

    # The 'root' directive MUST point to the full path of your website's files
    # on the host machine's filesystem.
    root {path_to_your_host_wordpress_root};
    index index.php index.html index.htm;

    # SSL configuration, replace these with your own certificate paths.
    ssl_certificate         {path_to_your_fullchain_pem};
    ssl_certificate_key     {path_to_your_privkey_pem};
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy logs, adjust the path and filename as needed.
    access_log      /var/log/nginx/{your_domain_name}.access.log;
    error_log       /var/log/nginx/{your_domain_name}.error.log;

    # This location block is the default catch-all for all non-specific requests.
    location / {
        # Tries to find the file, then directory, then falls back to index.php.
        try_files $uri $uri/ /index.php?$args;
    }

    # This location block handles all PHP files by passing them to PHP-FPM.
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {your_upstream_name};
        fastcgi_index index.php;
        include fastcgi_params;

        # The SCRIPT_FILENAME MUST be the path to the website's files
        # as seen from INSIDE the Docker container's filesystem.
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Global restrictions for security.
    location ~ /\. {
        deny all;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # This block handles all requests for static files, like images, CSS, and JS.
    # It's a performance optimization to enable long-term browser caching.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|eot|otf|ttf|woff|woff2)$ {
        # Set the cache-control header to a long duration, in this case, 30 days.
        # The 'max' value you used is also valid and is equivalent to 1 year.
        expires 30d;

        # Prevents Nginx from logging 404 errors for these files.
        log_not_found off;

        # Do not proxy the request. Nginx serves these files directly from the root.
        # We do not use proxy_pass here.

        # This also helps with cache headers and is a good practice.
        # A correct try_files directive is not explicitly needed here because
        # Nginx will serve files from the 'root' directory by default if they exist.
        # The main 'location /' block is the fallback for any file not found here.
        # The 'root' directive from the main server block will be used.
    }
}

